name: Build unrestricted-egress CodeAPI sandbox

on:
  pull_request:
    paths:
      - .github/workflows/build-patched-sandbox.yml
      - patches/codeapi-sandbox-unrestricted-egress-v2.patch
      - versions.env
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-patched-sandbox.yml
      - patches/codeapi-sandbox-unrestricted-egress-v2.patch
      - versions.env
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codeapi-sandbox-unrestricted-egress-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PATCH_VARIANT: unrestricted-egress-v2

jobs:
  config:
    name: Read image configuration
    runs-on: ubuntu-24.04
    outputs:
      upstream_repository: ${{ steps.config.outputs.upstream_repository }}
      upstream_sha: ${{ steps.config.outputs.upstream_sha }}
    steps:
      - name: Check out image configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read pinned source
        id: config
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-config.sh
          # shellcheck source=/dev/null
          source versions.env
          {
            echo "upstream_repository=${UPSTREAM_REPOSITORY}"
            echo "upstream_sha=${UPSTREAM_SHA}"
          } >>"${GITHUB_OUTPUT}"

  build:
    name: Test and build unrestricted-egress sandbox
    needs: config
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out image configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out pinned upstream source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ needs.config.outputs.upstream_repository }}
          ref: ${{ needs.config.outputs.upstream_sha }}
          path: upstream
          persist-credentials: false

      - name: Apply sandbox patch
        run: |
          set -euo pipefail
          git -C upstream apply --unidiff-zero --check ../patches/codeapi-sandbox-unrestricted-egress-v2.patch
          git -C upstream apply --unidiff-zero ../patches/codeapi-sandbox-unrestricted-egress-v2.patch

      - name: Run focused regression tests
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${PWD}/upstream:/src" \
            --mount type=tmpfs,destination=/src/api/node_modules \
            --workdir /src/api \
            oven/bun:1.3.14 \
            sh -ec 'bun install --frozen-lockfile && bun test src/nsjail.test.ts'

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tag
        id: image
        env:
          UPSTREAM_SHA: ${{ needs.config.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          image_name="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/codeapi-sandbox-runner"
          {
            echo "name=${image_name}"
            echo "tag=${image_name}:upstream-${UPSTREAM_SHA}-${PATCH_VARIANT}"
          } >>"${GITHUB_OUTPUT}"

      - name: Build and publish patched sandbox
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: upstream
          file: upstream/api/Dockerfile
          target: sandbox-runner-baked
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ needs.config.outputs.upstream_repository }}
            org.opencontainers.image.revision=${{ needs.config.outputs.upstream_sha }}
            org.opencontainers.image.version=${{ env.PATCH_VARIANT }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=min
          provenance: mode=max
          sbom: true

      - name: Record deployable digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          echo "### ${IMAGE_NAME}" >>"${GITHUB_STEP_SUMMARY}"
          echo '```text' >>"${GITHUB_STEP_SUMMARY}"
          echo "${IMAGE_NAME}@${DIGEST}" >>"${GITHUB_STEP_SUMMARY}"
          echo '```' >>"${GITHUB_STEP_SUMMARY}"
